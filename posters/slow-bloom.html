<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Bloom – concept poster by Jisk Dockey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,600&amp;family=Instrument+Serif:ital@0;1&amp;family=Syncopate:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap">
<style>
body{margin:0}
</style>
<style>html,body{margin:0;background:#0b0b0a;overflow:hidden}</style>
</head>
<body>

<div id="poster" style="transform-origin: 0 0; width: 1080px; height: 1350px; position: relative; overflow: hidden; background: radial-gradient(at 50% 28%, #fff0d9 0%, rgba(255,240,217,0) 36%), radial-gradient(at 10% 16%, #ff9a6b 0%, rgba(255,154,107,0) 44%), radial-gradient(at 92% 20%, #ffc46b 0%, rgba(255,196,107,0) 40%), radial-gradient(at 80% 62%, #e0559a 0%, rgba(224,85,154,0) 48%), radial-gradient(at 16% 72%, #7b3fb0 0%, rgba(123,63,176,0) 48%), radial-gradient(at 50% 110%, #170a22 0%, rgba(23,10,34,0) 60%), #3a1748; color: #2b0f2e; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif">

  <svg aria-hidden="true" viewBox="0 0 1080 1350" style="position: absolute; inset: 0; width: 100%; height: 100%">
    <defs>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"></feGaussianBlur></filter>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    </defs>
    <g filter="url(#soft)">
      <ellipse cx="300" cy="420" rx="260" ry="200" fill="#ff8a5c" opacity="0.75"></ellipse>
      <ellipse cx="820" cy="560" rx="240" ry="300" fill="#e0559a" opacity="0.7"></ellipse>
      <ellipse cx="420" cy="900" rx="360" ry="200" fill="#6b2fa0" opacity="0.65"></ellipse>
      <ellipse cx="620" cy="300" rx="220" ry="160" fill="#fff1d6" opacity="0.9"></ellipse>
    </g>
    <rect width="1080" height="1350" filter="url(#grain)" opacity="0.14" style="mix-blend-mode: overlay"></rect>
  </svg>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(22,8,32,0.82) 0%, rgba(0,0,0,0) 46%)"></div>

  <div style="position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; gap: 24px; font-size: 24px; font-weight: 600">
    <span>House music</span>
    <span>Edinburgh</span>
  </div>

  <div style="position: absolute; top: 120px; left: 52px; right: 52px; display: flex; flex-direction: column">
    <h1 style="margin: 0; display: flex; flex-direction: column; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-style: normal; font-weight: 200; font-stretch: 125%; font-size: 170px; line-height: 0.92; letter-spacing: 0.02em; text-transform: uppercase; width: 891px; height: 355px">
      <span>Slow</span>
      <span style="padding-left: 150px">Bloom</span>
    </h1>
    <p style="margin: 28px 0 0 12px; font-size: 30px; line-height: 1.3; max-width: 17em">Deep house</p>
  </div>

  <div style="position: absolute; left: 64px; right: 64px; bottom: 56px; display: flex; flex-direction: column; gap: 28px; color: #fff3e6">
    <div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 24px">
      <span style="font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-weight: 200; font-stretch: 125%; font-size: 88px; line-height: 0.9; text-transform: uppercase">Mara Lind</span>
      <span style="font-size: 30px">all night long</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-top: 22px; border-top: 1px solid rgba(255,243,230,0.45)">
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; opacity: 0.85">Date</span><span style="font-size: 28px; font-weight: 600">Fri 05.12.26</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; opacity: 0.85">Time</span><span style="font-size: 28px; font-weight: 600">22:00 – 03:00</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; opacity: 0.85">Where</span><span style="font-size: 28px; font-weight: 600">Leith, Edinburgh</span></div>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 24px; font-size: 18px; opacity: 0.85">
      <span>Tickets: link in bio</span>
      <span>Artwork: Jisk Dockey</span>
    </div>
  </div>

</div>

<script>
{ const f=()=>{const s=window.innerWidth/1080;document.getElementById('poster').style.transform='scale('+s+')';};
  addEventListener('resize',f); f(); }
</script>
</body>
</html>
