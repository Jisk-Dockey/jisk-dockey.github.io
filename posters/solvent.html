<!DOCTYPE html>
<html lang="en">
<head>

<title>Solvent – concept poster by Jisk Dockey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&amp;family=JetBrains+Mono:wght@400;700&amp;family=New+Rocker&amp;family=UnifrakturCook:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
<style>html,body{margin:0;background:#0b0b0a;overflow:hidden}</style>
</head>
<body>

<div id="poster" style="transform-origin: 0 0; width: 1080px; height: 1350px; position: relative; overflow: hidden; background: radial-gradient(ellipse 70% 55% at 50% 40%, #202124 0%, #0b0b0c 58%, #050505 100%); color: #e9e9ea; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">

  <!-- Studio floor under the chrome -->
  <div aria-hidden="true" style="position: absolute; left: 140px; right: 140px; top: 690px; height: 190px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0) 70%)"></div>

  <!-- Hero: rendered liquid chrome -->
  <div style="position: absolute; top: 140px; left: 40px; right: 40px; height: 720px; display: flex; align-items: center; justify-content: center">
    <img src="solvent-chrome.png" alt="A molten chrome sculpture: a twisted liquid-metal ribbon with a looping arch and a drip falling from its edge" style="max-width: 1000px; max-height: 700px; width: auto; height: auto; object-fit: contain; filter: none">
  </div>

        <stop offset="0.55" stop-color="#d4d5d9"></stop>
        <stop offset="1" stop-color="#8d9097"></stop>

    </g>
    <g transform="matrix(-1 0 0 1 1080 0)" fill="url(#metal)" opacity="0">
      <path d="M232,950 Q160,925 70,840 Q150,905 236,972 Z"></path>
      <path d="M230,958 Q150,960 50,978 Q150,978 232,972 Z"></path>
      <path d="M232,968 Q178,1000 120,1050 Q185,1012 238,980 Z"></path>
      <path d="M238,948 Q225,905 205,862 Q236,905 246,948 Z"></path>

      <circle cx="121" cy="1088" r="5.5"></circle>
    </g>
    <text x="540" y="1040" text-anchor="middle" font-family="'New Rocker', serif" font-weight="400" font-size="178" fill="url(#metal)" opacity="0">Solvent</text>

  <div style="position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 700">Hard techno</span>
      <span style="color: #a7a9ae">All night</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; text-align: right">
      <span style="font-weight: 700">Glasgow</span>
      <span style="color: #a7a9ae">145–160 BPM</span>
    </div>
  </div>

  <div style="position: absolute; left: 64px; right: 64px; bottom: 56px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-weight: 700; font-size: 40px; line-height: 1; text-transform: uppercase">Sat 12.12.26</span>
        <span style="font-size: 24px; color: #a7a9ae">23:00 – 06:00</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; text-align: right; font-weight: 700; font-size: 30px; line-height: 1.2; text-transform: uppercase">

      <span>Secret warehouse · location by text 48h before</span>
      <span><span style="color: #ff3b1f; font-weight: 700">18+</span> · Artwork: Jisk Dockey</span>
    </div>
  </div>

</div>

<script>
{ const f=()=>{const s=window.innerWidth/1080;document.getElementById('poster').style.transform='scale('+s+')';};
  addEventListener('resize',f); f(); }
</script>
