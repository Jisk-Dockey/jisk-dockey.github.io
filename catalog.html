<style>
:root{--accent:#ff3b1f}
html{scroll-behavior:smooth}
body{margin:0;background:#0b0b0a}
*{box-sizing:border-box}
a{color:#ecebe6}
a:hover{color:#ffffff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ecebe6;outline-offset:3px}
input::placeholder,textarea::placeholder{color:#8f8c85}
.spin{animation:spin 1.8s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
/* Lenis smooth scroll */
html.lenis,
html.lenis body {
  height: auto;
}

.lenis:not(.lenis-autoToggle).lenis-stopped {
  overflow: clip;
}

.lenis [data-lenis-prevent],
.lenis [data-lenis-prevent-wheel],
.lenis [data-lenis-prevent-touch],
.lenis [data-lenis-prevent-vertical],
.lenis [data-lenis-prevent-horizontal] {
  overscroll-behavior: contain;
}

.lenis.lenis-smooth iframe {
  pointer-events: none;
}

.lenis.lenis-autoToggle {
  transition-property: overflow;
  transition-duration: 1ms;
  transition-behavior: allow-discrete;
}
</style>
